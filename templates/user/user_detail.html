<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>用户详情</title>
</head>
<body>
    <h1>用户详情</h1>
</body>
</html>
<table>
    <tr>
        <th>用户名</th>
        <th>邮箱</th>
        <th>密码</th>
        <th>创建时间</th>
        <th>更新时间</th>
        <th>性别</th>
        <th>年龄</th>
        <th>手机号</th>
        <th>地址</th>
        <th>头像</th>
        <th>操作</th>
    </tr>
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.password }}</td>
        <td>{{ user.created_at }}</td>
        <td>{{ user.updated_at }}</td>
        <td>{{ user.gender }}</td>
        <td>{{ user.age }}</td>
        <td>{{ user.phone }}</td>
        <td>{{ user.address }}</td>
        <td>{{ user.avatar }}</td>
        <td>
            <a href="{% url 'user:edit_user' user.id %}">编辑</a>
            <a href="{% url 'user:delete_user' user.id %}">删除</a>
        </td>
    </tr>
</table>
